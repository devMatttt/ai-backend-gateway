services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_pgvector_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_memory
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: