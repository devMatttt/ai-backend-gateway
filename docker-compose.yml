networks:
  ai-backend-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max_ai
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONPATH=/workspace
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=ai_memory
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai-backend-network
    restart: unless-stopped

  # --- 2. PostgreSQL + pgvector Database ---
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai_pgvector_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ai_memory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-backend-network
    restart: unless-stopped

  # --- 3. Redis Cache Store ---
  redis:
    image: redis:7-alpine
    container_name: ai_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ai-backend-network
    restart: unless-stopped